app-id: com.aioconvert.aioconvert
branch: stable
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: AIOconvert
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: aioconvert
    buildsystem: simple
    build-commands:
      - cp -a . /app/
    sources:
      - type: dir
        path: ../../build/release/flatpak-files
